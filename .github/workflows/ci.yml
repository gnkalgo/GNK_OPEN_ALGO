name: GNK ALGO checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e -- --config playwright.server.config.ts
      - run: npm run build
        env:
          VITE_API_MODE: server
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gnk_test
          POSTGRES_DB: gnk_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gnk_test -d gnk_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://gnk_test:disposable-ci-only@127.0.0.1:5432/gnk_test
      TEST_DATABASE_URL: postgresql+psycopg://gnk_test:disposable-ci-only@127.0.0.1:5432/gnk_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      FRONTEND_URL: http://testserver
      COOKIE_SECURE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check app tests migrations
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gnk-api:ci backend
      - run: docker build -t gnk-web:ci frontend
